[project]
name = "hybrid-rag"
version = "0.1.0"
description = "PDF-based Hybrid Retrieval-Augmented Generation system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "groq>=1.7.0",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
